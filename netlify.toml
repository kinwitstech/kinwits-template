[build]
  command = "yarn build"
  publish = "dist"

[build.environment]
  VITE_LAMBDA_URL = "https://m2uddrfmcilo4k7oimuix7mply0ydavy.lambda-url.us-west-2.on.aws/"
  # Empty until the real Calendly link is approved. While it is empty every
  # Intro CTA falls back to /contact and no Calendly asset is requested.
  VITE_BOOKING_URL = ""

[[redirects]]
  from = "/work/intelligent-workflow"
  to = "/work/patient-portal"
  status = 301

[[redirects]]
  from = "/work/digital-platform"
  to = "/work/scheduling"
  status = 301

[[redirects]]
  from = "/*"
  to = "/"
  status = 200
