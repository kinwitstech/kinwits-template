<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" role="img" aria-label="Abstract data flow between two systems">
  <rect width="800" height="500" fill="#efefef"/>
  <!-- left system (CRM) -->
  <rect x="120" y="180" width="120" height="140" rx="8" stroke="#1a1a1a" stroke-opacity="0.28" stroke-width="1.5" fill="none"/>
  <g fill="#1a1a1a">
    <circle cx="180" cy="222" r="5"/>
    <circle cx="180" cy="250" r="5" fill-opacity="0.45"/>
    <circle cx="180" cy="278" r="5" fill-opacity="0.45"/>
  </g>
  <!-- right system (EMR) -->
  <rect x="560" y="180" width="120" height="140" rx="8" stroke="#1a1a1a" stroke-opacity="0.28" stroke-width="1.5" fill="none"/>
  <g fill="#1a1a1a">
    <circle cx="620" cy="222" r="5"/>
    <circle cx="620" cy="250" r="5" fill-opacity="0.45"/>
    <circle cx="620" cy="278" r="5" fill-opacity="0.45"/>
  </g>
  <!-- flow lines through the bridge -->
  <g stroke="#1a1a1a" stroke-opacity="0.3" stroke-width="1.5">
    <line x1="240" y1="250" x2="372" y2="250"/>
    <line x1="428" y1="250" x2="560" y2="250"/>
  </g>
  <!-- flow direction markers -->
  <g fill="#1a1a1a" fill-opacity="0.55">
    <circle cx="300" cy="250" r="3"/>
    <circle cx="500" cy="250" r="3"/>
  </g>
  <!-- central bridge node -->
  <circle cx="400" cy="250" r="14" fill="#1a1a1a"/>
  <circle cx="400" cy="250" r="26" stroke="#1a1a1a" stroke-opacity="0.3" fill="none"/>
  <circle cx="400" cy="250" r="40" stroke="#1a1a1a" stroke-opacity="0.12" fill="none"/>
</svg>
