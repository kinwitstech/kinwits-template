<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" role="img" aria-label="Abstract website layout wireframe">
  <rect width="800" height="500" fill="#efefef"/>
  <!-- browser window -->
  <rect x="170" y="90" width="460" height="320" rx="12" fill="#fafafa" stroke="#1a1a1a" stroke-opacity="0.3" stroke-width="1.5"/>
  <!-- top bar -->
  <line x1="170" y1="126" x2="630" y2="126" stroke="#1a1a1a" stroke-opacity="0.2" stroke-width="1.5"/>
  <circle cx="194" cy="108" r="4" fill="#1a1a1a" fill-opacity="0.55"/>
  <circle cx="210" cy="108" r="4" fill="#1a1a1a" fill-opacity="0.3"/>
  <circle cx="226" cy="108" r="4" fill="#1a1a1a" fill-opacity="0.3"/>
  <!-- heading lines -->
  <rect x="200" y="152" width="150" height="14" rx="3" fill="#1a1a1a"/>
  <rect x="200" y="178" width="230" height="7" rx="3" fill="#1a1a1a" fill-opacity="0.3"/>
  <rect x="200" y="192" width="190" height="7" rx="3" fill="#1a1a1a" fill-opacity="0.3"/>
  <!-- hero block -->
  <rect x="200" y="218" width="400" height="78" rx="6" fill="#1a1a1a" fill-opacity="0.08"/>
  <!-- card row -->
  <rect x="200" y="312" width="120" height="62" rx="6" stroke="#1a1a1a" stroke-opacity="0.28" stroke-width="1.5" fill="none"/>
  <rect x="340" y="312" width="120" height="62" rx="6" stroke="#1a1a1a" stroke-opacity="0.28" stroke-width="1.5" fill="none"/>
  <rect x="480" y="312" width="120" height="62" rx="6" stroke="#1a1a1a" stroke-opacity="0.28" stroke-width="1.5" fill="none"/>
</svg>
